<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровой летописец — Ұлы Дала</title>
<style>
:root{--indigo:#23305E;--ochre:#C48A2C;--terra:#A4472B;--sand:#E3D2AE;--paper:#F3EAD6;--ink:#2A2118;--ok:#2F6B3F;--bad:#9A2B2B}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--indigo);color:var(--paper);padding:22px 16px 18px;border-bottom:6px solid var(--ochre)}
h1{margin:0;font:700 28px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.5px}
header p{margin:6px 0 0;opacity:.85;font-size:14px}
main{max-width:560px;margin:0 auto;padding:16px}
section{background:var(--paper);border:1px solid #cdb98f;border-radius:6px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font:700 18px Georgia,serif;color:var(--indigo)}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--indigo);background:#fff8e8;color:var(--indigo);border-radius:4px;padding:10px 4px;min-height:44px}
button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
button.on{background:var(--indigo);color:var(--paper)}
.roll{width:100%;margin-top:10px;background:var(--terra);border-color:var(--terra);color:#fff;font-weight:700}
.hexes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hexes button{text-align:left;padding:8px 10px}
.hexes small{display:block;opacity:.7}
.go{width:100%;background:var(--ochre);border-color:var(--ochre);color:#1d1408;font-weight:700}
.go:disabled{opacity:.45;cursor:default}
.q{font:700 18px/1.35 Georgia,serif;margin:0 0 10px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;padding:10px 12px}
.opts button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.fact{margin-top:10px;padding:10px 12px;border-left:4px solid var(--ochre);background:#fbf4e2}
.res{font-weight:700;margin:10px 0 0}
.event{border-left:4px solid var(--terra);padding-left:12px}
.stat{display:flex;justify-content:space-between;font-size:14px}
.hide{display:none}
.dice{font:700 22px Georgia,serif;text-align:center;margin-top:8px;min-height:30px}
.hx{cursor:pointer}.hx.dim{opacity:.3}.hx.hit .ring{stroke:#23305E;stroke-width:4}
.hx:focus-visible .ring{stroke:#C48A2C;stroke-width:4}.hx:focus{outline:none}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:13px;margin:6px 10px 0 0}
.lg i{width:12px;height:12px;border-radius:2px;display:inline-block}
header{position:relative}#mus{position:absolute;right:12px;top:14px;min-height:36px;padding:6px 10px;background:transparent;color:var(--paper);border-color:var(--paper)}
@media (min-width:1000px){
main{max-width:1500px;display:grid;grid-template-columns:400px 1fr;grid-template-areas:"modes board" "num board" "card board" "stats board";grid-template-rows:auto auto auto 1fr;column-gap:20px;padding:20px}
body{font-size:18px}h1{font-size:36px}h2{font-size:21px}.q{font-size:22px}
#board{max-height:calc(100vh - 190px)}
}
</style>
</head>
<body>
<header>
<h1>Цифровой летописец</h1>
<p>Ұлы Дала · помощник игры. Прототип (бета)</p>
<button id="mus">Музыка: вкл</button>
<audio id="aud" src="music.mp3" loop preload="none"></audio>
</header>
<main>
<section style="grid-area:modes">
<h2>Режим вопросов (для учителя)</h2>
<div class="hexes" id="modes" style="grid-template-columns:1fr"></div>
</section>

<section style="grid-area:num">
<h2>1. Какое число выпало?</h2>
<div class="nums" id="nums"></div>
<button class="roll" id="roll">Бросить два кубика на экране</button>
<div class="dice" id="dice" aria-live="polite"></div>
</section>

<section style="grid-area:board">
<h2>2. Нажмите гекс с этим числом</h2>
<svg id="board" viewBox="0 0 440 400" width="100%" role="img" aria-label="Игровое поле из 19 гексов" style="font-family:inherit"></svg>
<div id="legend"></div>
</section>

<section id="card" class="hide" style="grid-area:card" aria-live="polite"></section>

<section style="grid-area:stats">
<h2>Итоги партии</h2>
<div class="stat"><span>Вопросов задано</span><b id="sAsked">0</b></div>
<div class="stat"><span>Верных ответов</span><b id="sRight">0</b></div>
<div class="stat"><span>Бонусных ресурсов</span><b id="sBonus">0</b></div>
</section>
</main>

<script>
var HEX={
horse:{n:"Жайлау",r:"Жылқы (конь)"},
willow:{n:"Тоғай",r:"Тал (ива)"},
sheep:{n:"Таулы бөктер",r:"Қой (овцы)"},
wheat:{n:"Егіншілік алқабы",r:"Бидай (зерно)"},
brick:{n:"Қыш пештері",r:"Кірпіш (кирпич)"}
};
var Q={
horse:[
["Из молока какого животного готовят кымыз?",["Кобылы","Козы","Верблюдицы"],0,"Кымыз — традиционный напиток кочевников, его делают из кобыльего молока."],
["Какое животное было главным транспортом кочевников степи?",["Верблюд","Лошадь","Бык"],1,"Конь давал кочевнику скорость, охоту, торговлю и защиту стада."],
["Как называется конный отряд казахского ополчения?",["Жасақ","Арба","Көш"],0,"Жасақ собирали из свободных кочевников при угрозе набега."]
],
willow:[
["Из чего делали решётку стен юрты (кереге)?",["Из ивы (тала)","Из железа","Из камня"],0,"Решётку юрты делали из гибких ивовых прутьев."],
["Как называется круглое навершие юрты?",["Шанырак","Тумар","Кереге"],0,"Шанырак — символ дома и рода, его передавали по наследству."],
["Где в степи растут ивовые рощи?",["На вершинах гор","По поймам рек","В пустыне"],1,"Тоғай — пойменные рощи, они растут вдоль рек."]
],
sheep:[
["Из чего делают кииз?",["Из шерсти","Из дерева","Из глины"],0,"Кииз — войлок: его валяют из овечьей шерсти и покрывают им юрту."],
["Какой скот считался основой богатства кочевника?",["Рыба","Овцы и лошади","Свиньи"],1,"Скот был главным богатством; им же платили штрафы по закону."],
["Как называется сезонное передвижение кочевников?",["Көш","Жайма","Тоғай"],0,"Көш — перекочёвка между зимними и летними пастбищами."]
],
wheat:[
["Вдоль какой реки на юге развивалось орошаемое земледелие?",["Сырдарья","Иртыш","Жайык"],0,"В оазисах Сырдарьи выращивали зерно с помощью каналов."],
["Как называется искусственный канал для полива?",["Арык","Көш","Кереге"],0,"Арык — оросительный канал, основа земледелия в оазисах."],
["Какая культура была важной в южных земледельческих оазисах?",["Пшеница","Рис с островов","Картофель"],0,"Зерно, в первую очередь пшеница, выращивали в оазисах и обменивали у кочевников на скот."]
],
brick:[
["Из чего построен мавзолей Ходжи Ахмеда Ясави?",["Из жжёного кирпича","Из дерева","Из войлока"],0,"Мавзолей в Туркестане построен из жжёного кирпича."],
["В каком городе находится мавзолей Ходжи Ахмеда Ясави?",["Туркестан","Семей","Актау"],0,"Туркестан был важным городом юга и центром ханства."],
["Как называется торговая дорога, соединявшая Восток и Запад?",["Великий Шёлковый путь","Көш жолы","Золотая тропа"],0,"Города на Сырдарье стояли на ветвях Великого Шёлкового пути."]
]
};
var EV=[
["Барымта","Соседний род угнал часть скота. Игрок, бросивший 7, двигает Барымташы и забирает ресурс. Закон «Жеті Жарғы» требует возместить ущерб скотом (құн)."],
["Жоңғар шапқыншылығы","Отряды джунгар вторглись в степь. Игрок, у которого больше 7 карт, отдаёт половину: так ханство собирало жасақ и теряло запасы."],
["Құрылтай","Старейшины собрались решать общие дела. Верните Барымташы на пустыню Бетпақ-Дала и обсудите, кому нужна помощь."]
];
var num=null,hex=null,asked=0,right=0,bonus=0,used={};
var numsEl=document.getElementById("nums"),card=document.getElementById("card"),diceEl=document.getElementById("dice");
for(var i=2;i<=12;i++){(function(v){var b=document.createElement("button");b.textContent=v;b.onclick=function(){setNum(v)};numsEl.appendChild(b)})(i)}
function mark(box,fn){[].forEach.call(box.children,function(c){c.classList.toggle("on",fn(c))})}
var mode="all";
var MODES=[["off","Без вопросов","Только числа и события"],["68","Только 6 и 8","Вопрос на самых частых числах"],["all","Каждый бросок","Вопрос на любое число"]];
var modesEl=document.getElementById("modes");
MODES.forEach(function(m){var b=document.createElement("button");b.innerHTML=m[1]+"<small>"+m[2]+"</small>";b.dataset.k=m[0];b.onclick=function(){mode=m[0];mark(modesEl,function(c){return c.dataset.k===mode});refresh()};modesEl.appendChild(b)});
mark(modesEl,function(c){return c.dataset.k===mode});
function needQ(){return num&&num!==7&&(mode==="all"||(mode==="68"&&(num===6||num===8)))}
function refresh(){
if(num===7)showEvent();
else if(!num)card.className="hide";
else if(needQ()){card.className="";card.innerHTML="<p>Число "+num+": нажмите на подсвеченный гекс, чтобы получить вопрос.</p>"}
else{card.className="";card.innerHTML="<p>Число "+num+": вопроса нет в этом режиме. Ресурсы выдаются по обычным правилам.</p>"}
paint()}
function setNum(v,keep){num=v;mark(numsEl,function(c){return c.textContent==v});
if(!keep)diceEl.textContent="";
refresh()}
document.getElementById("roll").onclick=function(){
var a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
diceEl.textContent=a+" + "+b+" = "+(a+b);setNum(a+b,true)};

var T={H:["horse","#8E5B2E"],W:["willow","#2E7D4F"],S:["sheep","#9CC25A"],G:["wheat","#E3B93C"],B:["brick","#C0562F"],D:[null,"#D9CBA3"]};
function ring(){
var CX=220,CY=200,RI=172,RO=212,NB=[["Сібір","#5E7F6B","siberia"],["Жоңғар","#7B5E91","dzungar"],["Цин","#B23A3A","qing"],["Бұхара","#2F5D8A","bukhara"],["Хиуа","#A8793A","khiva"],["Ноғай","#8A6D4B","nogai"]],WM=[2,3,4,5,0,1],o="";
function P(r,k){var g=Math.PI/3*k;return[CX+r*Math.cos(g),CY+r*Math.sin(g)]}
for(var k=0;k<6;k++){
var p=[P(RI,k),P(RI,k+1),P(RO,k+1),P(RO,k)],nb=NB[WM[k]];
var xs=p.map(function(q){return q[0]}),ys=p.map(function(q){return q[1]});
var x0=Math.min.apply(null,xs),y0=Math.min.apply(null,ys),x1=Math.max.apply(null,xs),y1=Math.max.apply(null,ys);
var pts=p.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ");
var cx=(xs[0]+xs[1]+xs[2]+xs[3])/4,cy=(ys[0]+ys[1]+ys[2]+ys[3])/4;
o+='<defs><clipPath id="wd'+k+'"><polygon points="'+pts+'"/></clipPath></defs><polygon points="'+pts+'" fill="'+nb[1]+'"/><image href="'+nb[2]+'.jpg" x="'+x0.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+(x1-x0).toFixed(1)+'" height="'+(y1-y0).toFixed(1)+'" preserveAspectRatio="xMidYMid slice" clip-path="url(#wd'+k+')" onerror="imgErr(this)"/><polygon points="'+pts+'" fill="none" stroke="#fbf4e2" stroke-width="2"/><text x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#fff" stroke="#1d1408" stroke-width="3" paint-order="stroke" style="pointer-events:none">'+nb[0]+'</text>'}
return o}
var IMG={H:"horse",W:"willow",S:"sheep",G:"wheat",B:"brick",D:"desert"};
function imgErr(i){var h=i.getAttribute("href");if(/\.jpg$/.test(h))i.setAttribute("href",h.replace(".jpg",".png"));else i.remove()}
var ROWS=[3,4,5,4,3],LAY="HWS"+"SGHW"+"SGDBW"+"GBHS"+"WGB",NUMS=[9,4,8,6,11,5,3,10,3,9,4,8,5,10,6,11,2,12];
var board=document.getElementById("board"),cells=[];
(function(){
var w=62,R=w/Math.sqrt(3),idx=0,ni=0,h=ring();
var cp=[];for(var q=0;q<6;q++){var g0=Math.PI/180*(60*q-30);cp.push((R*.97*Math.cos(g0)).toFixed(1)+","+(R*.97*Math.sin(g0)).toFixed(1))}
h='<defs><clipPath id="hexclip"><polygon points="'+cp.join(" ")+'"/></clipPath></defs>'+h;
ROWS.forEach(function(n,r){for(var i=0;i<n;i++){
var x=220+(i-(n-1)/2)*w,y=92.6+r*1.5*R,t=LAY[idx],tok=t==="D"?null:NUMS[ni++],pts=[];
for(var a=0;a<6;a++){var g=Math.PI/180*(60*a-30);pts.push((x+R*Math.cos(g)).toFixed(1)+","+(y+R*Math.sin(g)).toFixed(1))}
cells.push({t:t,n:tok});
var nm=t==="D"?"Бетпақ-Дала":HEX[T[t][0]].n;
h+='<g class="hx" data-i="'+idx+'" tabindex="0" role="button" aria-label="'+nm+(tok?", число "+tok:"")+'"><polygon points="'+pts.join(" ")+'" fill="'+T[t][1]+'" stroke="#fbf4e2" stroke-width="2"/><g transform="translate('+x+','+y+')"><image href="'+IMG[t]+'.jpg" x="-39.2" y="-39.2" width="78.4" height="78.4" clip-path="url(#hexclip)" onerror="imgErr(this)"/></g><polygon class="ring" points="'+pts.join(" ")+'" fill="none"/>';
if(tok)h+='<circle cx="'+x+'" cy="'+y+'" r="14" fill="#fbf4e2"/><text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="'+(tok===6||tok===8?"#A32D2D":"#2A2118")+'">'+tok+'</text>';
else h+='<circle cx="'+x+'" cy="'+y+'" r="12" fill="#2A2118"/><text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#fff">Б</text>';
h+='</g>';idx++}});
board.innerHTML=h;
var lg="";for(var k in T){lg+='<span class="lg"><i style="background:'+T[k][1]+'"></i>'+(T[k][0]?HEX[T[k][0]].n+" — "+HEX[T[k][0]].r:"Бетпақ-Дала (пустыня)")+'</span>'}
document.getElementById("legend").innerHTML=lg})();
function paint(){[].forEach.call(board.querySelectorAll(".hx"),function(g){var c=cells[+g.dataset.i],hit=num&&num!==7&&c.n===num;
g.classList.toggle("hit",!!hit);g.classList.toggle("dim",!!num&&num!==7&&!hit)})}
function hexClick(i){var c=cells[i];
if(!num||num===7)return;
if(c.n!==num){card.className="";card.innerHTML="<p>На этом гексе число "+(c.n||"нет")+", а выпало "+num+". Выберите подсвеченный гекс.</p>";return}
if(!needQ()){card.className="";card.innerHTML="<p>Гекс «"+HEX[T[c.t][0]].n+"» приносит: "+HEX[T[c.t][0]].r+". Вопроса в этом режиме нет.</p>";return}
askHex(T[c.t][0])}
board.onclick=function(e){var g=e.target.closest(".hx");if(g)hexClick(+g.dataset.i)};
board.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){var g=e.target.closest(".hx");if(g){e.preventDefault();hexClick(+g.dataset.i)}}};
var aud=document.getElementById("aud"),mus=document.getElementById("mus");
mus.onclick=function(){if(aud.paused){aud.volume=.4;aud.play().then(function(){mus.textContent="Музыка: выкл"}).catch(function(){mus.textContent="Нет файла музыки"})}else{aud.pause();mus.textContent="Музыка: вкл"}};
aud.onerror=function(){mus.textContent="Нет файла музыки"};
function showEvent(){
var e=EV[Math.floor(Math.random()*EV.length)];
card.className="";card.innerHTML="<div class='event'><h2>Выпало 7: "+e[0]+"</h2><p>"+e[1]+"</p></div>"}
function askHex(key){hex=key;
var deck=Q[hex];used[hex]=used[hex]||[];
if(used[hex].length>=deck.length)used[hex]=[];
var left=[];deck.forEach(function(q,i){if(used[hex].indexOf(i)<0)left.push(i)});
var idx=left[Math.floor(Math.random()*left.length)];used[hex].push(idx);
var q=deck[idx],order=[0,1,2].sort(function(){return Math.random()-.5});
asked++;card.className="";
var h="<h2>Вопрос: "+HEX[hex].n+"</h2><p class='q'>"+q[0]+"</p><div class='opts'>";
order.forEach(function(o){h+="<button data-o='"+o+"'>"+q[1][o]+"</button>"});
card.innerHTML=h+"</div><div id='out'></div>";
[].forEach.call(card.querySelectorAll(".opts button"),function(b){b.onclick=function(){answer(b,q)}});
card.scrollIntoView({behavior:"smooth",block:"start"});
document.getElementById("sAsked").textContent=asked};
function answer(b,q){
var ok=+b.dataset.o===q[2];
[].forEach.call(card.querySelectorAll(".opts button"),function(x){x.disabled=true;if(+x.dataset.o===q[2])x.classList.add("right")});
if(!ok)b.classList.add("wrong");
if(ok){right++;bonus++}
document.getElementById("out").innerHTML=
"<p class='res'>"+(ok?"Верно! Бонус: +1 "+HEX[hex].r+" к ресурсу за бросок.":"Неверно. Ресурс по броску вы всё равно получаете.")+"</p><div class='fact'><b>Тарихи дерек:</b> "+q[3]+"</div>";
document.getElementById("sRight").textContent=right;
document.getElementById("sBonus").textContent=bonus}
</script>
</body>
</html>
